services:
  # 1. PostgreSQL Database Container
  postgres:
    image: postgres:15-alpine
    container_name: viewora-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-viewora_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Server API Container (Express + Prisma)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: viewora-server
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env          # ← secrets live here (git-ignored)
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgrespassword@postgres:5432/viewora_db?schema=public}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PHONEPE_ENV: ${PHONEPE_ENV:-sandbox}
      PHONEPE_SALT_INDEX: ${PHONEPE_SALT_INDEX:-1}
      PHONEPE_BASE_URL_SANDBOX: https://api-preprod.phonepe.com/apis/pg-sandbox
      PHONEPE_BASE_URL_PRODUCTION: https://api.phonepe.com/apis/hermes
      EMAIL_HOST: ${EMAIL_HOST:-smtp-relay.brevo.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Client App Container (Next.js)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
    container_name: viewora-client
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env          # ← secrets live here (git-ignored)
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_URL: ${BACKEND_URL:-http://viewora-server:5000}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://viewora-server:5000/api/v1}
    depends_on:
      - server

volumes:
  postgres_data: