name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Lint & Type-Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Validate & Build Server
        run: |
          cd server
          npm ci
          npx prisma generate
          npm run build

      - name: Lint & Build Client
        run: |
          cd client
          npm ci
          npm run lint
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  build-and-push-server:
    name: Build & Push Server Docker Image
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            vikasurao/viewora-server:latest
            index.docker.io/vikasurao/viewora-server:latest

  build-and-push-client:
    name: Build & Push Client Docker Image
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            vikasurao/viewora-client:latest
            index.docker.io/vikasurao/viewora-client:latest

  deploy-server:
    name: Deploy Server to Azure Web App
    needs: build-and-push-server
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Server Container to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'viewora-api-app'
          publish-profile: ${{ secrets.AZURE_SERVER_PUBLISH_PROFILE }}
          images: 'index.docker.io/vikasurao/viewora-server:latest'

  deploy-client:
    name: Deploy Client to Azure Web App
    needs: build-and-push-client
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Client Container to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Viewora-v2'
          publish-profile: ${{ secrets.AZURE_CLIENT_PUBLISH_PROFILE }}
          images: 'index.docker.io/vikasurao/viewora-client:latest'
